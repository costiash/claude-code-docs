name: Test Suite

on:
  push:
    branches: [ main, master, development ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python3 -m pip install -r scripts/requirements.txt
          python3 -m pip install pytest pytest-cov pytest-asyncio pytest-mock pyyaml

      - name: Run unit tests
        run: |
          if [ -d "tests/unit" ]; then
            pytest tests/unit/ -v --cov=scripts --cov-report=term
          else
            echo "Unit tests not yet implemented"
          fi

      - name: Run integration tests
        run: |
          if [ -d "tests/integration" ]; then
            pytest tests/integration/ -v --cov=scripts --cov-append --cov-report=term
          else
            echo "Integration tests not yet implemented"
          fi

      # The jq safeguard mirror must behave identically on the runner's jq
      # (1.7.x on ubuntu-latest) and on jq 1.6 (the empty-input / error-path
      # quirks differ). Download both release binaries, verify their sha256,
      # and re-run the step-execution tests under each explicitly. External
      # dependency: the two jqlang release assets below; the sha256 pins mean a
      # re-tagged or replaced asset fails loudly here rather than drifting.
      - name: Safeguard step tests under pinned jq 1.6 and 1.7.1
        run: |
          set -euo pipefail
          # fetch <version> <asset-url> <sha256>: --fail turns a CDN error page into
          # a curl error instead of a saved "binary"; --retry-all-errors retries it;
          # and the checksum is re-tried as a whole up to 3 times, so one bad body
          # (seen once on a matrix cell) cannot fail the job on its own.
          fetch() {
            local v="$1" url="$2" sum="$3" attempt
            mkdir -p "/tmp/jqbin/$v"
            for attempt in 1 2 3; do
              if curl -fsSL --proto '=https' --max-time 60 --retry 3 --retry-all-errors \
                   -o "/tmp/jqbin/$v/jq" "$url" \
                 && echo "$sum  /tmp/jqbin/$v/jq" | sha256sum -c - ; then
                chmod +x "/tmp/jqbin/$v/jq"; return 0
              fi
              rm -f "/tmp/jqbin/$v/jq"
              if [ "$attempt" -lt 3 ]; then
                echo "::warning::jq $v download attempt $attempt failed checksum/transfer; retrying"
                sleep 5
              fi
            done
            echo "::error::jq $v could not be fetched with a matching sha256 after 3 attempts"; return 1
          }
          fetch 1.6   https://github.com/jqlang/jq/releases/download/jq-1.6/jq-linux64 \
                      af986793a515d500ab2d35f8d2aecd656e764504b789b66d7e1a0b727a124c44
          fetch 1.7.1 https://github.com/jqlang/jq/releases/download/jq-1.7.1/jq-linux-amd64 \
                      5942c9b0934e510ee61eb3e30273f1b3fe2590df93933a93d7c58b81d19c8ff5
          for v in 1.6 1.7.1; do
            echo "== jq $v: $(PATH=/tmp/jqbin/$v:$PATH jq --version) =="
            PATH="/tmp/jqbin/$v:$PATH" pytest tests/integration/test_github_actions.py \
              -k "SafeguardStepExecution" -q --no-cov -p no:cacheprovider
          done

      - name: Run validation tests
        run: |
          if [ -d "tests/validation" ]; then
            pytest tests/validation/ -v --cov=scripts --cov-append --cov-report=xml --cov-report=term
          else
            echo "Validation tests not yet implemented"
          fi

      - name: Generate coverage reports
        run: |
          if [ -f "coverage.xml" ]; then
            python3 -m pip install coverage
            # Generate HTML coverage report
            coverage html -d htmlcov
            # Generate JSON coverage report
            coverage json -o coverage.json
            echo "Coverage reports generated successfully"
          else
            echo "No coverage data found"
          fi

      - name: Check coverage threshold
        run: |
          if [ -f "coverage.xml" ]; then
            python3 -m pip install coverage
            coverage report --fail-under=50
          else
            echo "Skipping coverage check - no coverage data"
          fi

      - name: Upload coverage HTML artifact
        if: always() && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html-report-py312
          path: htmlcov/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload coverage JSON artifact
        if: always() && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-json-report-py312
          path: coverage.json
          retention-days: 30
          if-no-files-found: warn

  # Run the shell-script test suites on macOS so the real shell scripts execute
  # under BSD userland (BSD grep/sed/stat, /bin/bash 3.2).
  shell-macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Ensure jq is available
        run: which jq || brew install jq

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # pytest-cov is required even though the run passes --no-cov: pyproject.toml
      # addopts inject --cov flags, which are unrecognized without the plugin.
      - name: Install dependencies
        run: python3 -m pip install pytest pytest-cov pytest-mock pyyaml requests

      - name: Run shell-script tests (BSD userland)
        run: python3 -m pytest tests/unit/test_fetch_docs_sh.py tests/unit/test_manifest_diff_sh.py --no-cov -q

      # Search-quality harness over the committed manifest/index (no page cache
      # needed). Wired into CI once the fuzzy-search awk rewrite cut it from
      # ~10 min to ~12s (issue #30).
      - name: Run search-quality harness
        run: ./test-skills.sh

      # macOS ships /bin/bash 3.2 — fail fast on bash-4+ only constructs.
      # Comment lines are excluded so prose mentioning a builtin (e.g. "No
      # mapfile: ...") doesn't trip the check; only code positions count.
      # No \b word boundaries: that's a GNU extension this BSD-grep job
      # can't rely on; the comment filter alone removes the false positive.
      - name: Check bash 3.2 compatibility
        run: |
          MATCHES=$(grep -rnE 'mapfile|readarray|declare -A|wait -n|\$\{[A-Za-z_]+(\^\^|,,)\}' plugin/ install.sh uninstall.sh \
            | grep -vE '^[^:]+:[0-9]+:[[:space:]]*#' || true)
          if [ -n "$MATCHES" ]; then
            echo "$MATCHES"
            echo "::error::bash 4+ construct found - scripts must stay bash 3.2 compatible (macOS /bin/bash)"
            exit 1
          fi
          echo "No bash 4+ constructs found"
