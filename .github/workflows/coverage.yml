name: Coverage Report

on:
  push:
    branches: [ main, master, development ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python3 -m pip install -r scripts/requirements.txt
          python3 -m pip install pytest pytest-cov pytest-asyncio pytest-mock pyyaml coverage

      - name: Generate coverage
        run: |
          pytest tests/ -v --cov=scripts --cov-report=html --cov-report=term --cov-report=xml -m "not slow and not network"

      - name: Check coverage threshold (50%)
        run: |
          if [ -f ".coverage" ]; then
            coverage report --fail-under=50
          else
            echo "No coverage data generated"
          fi

      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-html
          path: htmlcov/
