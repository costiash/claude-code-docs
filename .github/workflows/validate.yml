name: Validate Documentation

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 6am UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python3 -m pip install -r scripts/requirements.txt
          python3 -m pip install pytest pytest-cov pytest-asyncio pytest-mock pyyaml

      - name: Validate sampled manifest URLs are reachable
        run: |
          set -euo pipefail
          # v2: the manifest is the source of truth. Sample its md_urls and HEAD-check
          # them (jq + curl only — no Python, no committed docs needed).
          SAMPLE=$(jq -r '.pages[].md_url | select(. != null)' paths_manifest.json | shuf | head -30)
          TOTAL=0
          FAIL=0
          while IFS= read -r url; do
            [ -z "$url" ] && continue
            TOTAL=$((TOTAL + 1))
            # No -L: the fetch pipeline treats ANY 3xx as unfetchable (client uses
            # --max-redirs 0, fetcher rejects redirects), so following redirects
            # here would monitor a contract nothing else honors — a URL that
            # redirects is a broken URL for every consumer of the manifest.
            code=$(curl -s -o /dev/null -w '%{http_code}' -I --max-redirs 0 --proto '=https' --max-time 20 "$url" || echo "000")
            if [ "$code" != "200" ]; then
              echo "::warning::HTTP $code for $url (3xx counts as broken: clients fetch with --max-redirs 0)"
              FAIL=$((FAIL + 1))
            fi
          done <<< "$SAMPLE"
          echo "Reachability sample: $((TOTAL - FAIL))/$TOTAL returned 200"
          # Tolerate the odd transient failure; fail the run only on a broad outage.
          if [ "$FAIL" -gt 5 ]; then
            echo "::error::$FAIL of $TOTAL sampled URLs unreachable — likely a discovery/host problem."
            exit 1
          fi

      - name: Run validation tests
        run: |
          if [ -d "tests/validation" ] && [ "$(ls -A tests/validation)" ]; then
            pytest tests/validation/ -v --tb=short
          else
            echo "Validation tests not yet implemented"
          fi

      - name: Generate validation report
        run: |
          set -euo pipefail
          mkdir -p reports
          # Use UTC dates and safe filename format
          REPORT_DATE=$(date -u +'%Y-%m-%d')
          REPORT_FILE="reports/validation-$(date -u +'%Y%m%d').md"

          # Use printf for safer output generation
          {
            printf "# Validation Report - %s\n" "${REPORT_DATE}"
            printf "\n"
            printf "Validation completed at %s\n" "$(date -u)"
          } > "${REPORT_FILE}"

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: validation-report
          path: reports/validation-*.md
