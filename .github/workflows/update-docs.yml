name: Update Claude Code Documentation

on:
  schedule:
    # Every 3 hours (00:00, 03:00, ... UTC)
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-docs
  cancel-in-progress: false

jobs:
  update-docs:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        ref: main

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python3 -m pip install --upgrade pip
        python3 -m pip install -r scripts/requirements.txt

    # Fetch discovers (llms.txt ∪ sitemap) and writes the v2 manifest at the repo
    # root; pages are fetched into the gitignored .doc_fetch/ scratch (never committed).
    # The fetcher's own safeguards (discovery >=200, <=10% manifest removal, >=250
    # floor) abort the run before writing on a bad transition.
    - name: Fetch latest documentation (v2 manifest)
      id: fetch-docs
      env:
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_REF_NAME: ${{ github.ref_name }}
      run: python3 scripts/fetch_claude_docs.py

    # Build the prose-free search index from the scratch dir (floor guard refuses an
    # empty/tiny scratch, so a partial fetch can't produce a content-less index).
    - name: Build search index
      run: python3 scripts/build_search_index.py

    # Belt-and-suspenders shell safeguard: the manifest must still have >=250 pages.
    - name: Safeguard — manifest page count
      run: |
        COUNT=$(jq '.pages | length' paths_manifest.json)
        echo "Manifest pages: $COUNT"
        if [ "$COUNT" -lt 250 ]; then
          echo "::error::🚨 SAFEGUARD: manifest has only $COUNT pages (<250). Refusing to commit."
          exit 1
        fi

    # The fetcher rewrites generated_at on every run, so a raw `git diff` is never
    # clean. Compare against HEAD with generated_at stripped from both sides so a
    # commit only lands when actual content (pages, index entries) changed.
    - name: Check for changes
      id: verify-changed-files
      run: |
        set -euo pipefail
        git add paths_manifest.json search_index.json
        CHANGED=false
        for f in paths_manifest.json search_index.json; do
          if git cat-file -e "HEAD:$f" 2>/dev/null; then
            if ! diff -q <(git show "HEAD:$f" | jq 'del(.generated_at)') \
                         <(jq 'del(.generated_at)' "$f") >/dev/null; then
              echo "$f: content changed"
              CHANGED=true
            fi
          else
            # First run: file does not exist in HEAD yet.
            echo "$f: not present in HEAD (first run)"
            CHANGED=true
          fi
        done
        echo "changed=$CHANGED" >> $GITHUB_OUTPUT

    - name: Generate commit message from manifest diff
      if: steps.verify-changed-files.outputs.changed == 'true'
      id: commit-msg
      run: |
        git show HEAD:paths_manifest.json > /tmp/old_manifest.json 2>/dev/null || echo '{"pages":[]}' > /tmp/old_manifest.json
        SUMMARY=$(jq -rn --slurpfile old /tmp/old_manifest.json --slurpfile new paths_manifest.json '
          ($old[0].pages // [] | map({(.id): .}) | add // {}) as $o
          | ($new[0].pages // [] | map({(.id): .}) | add // {}) as $n
          | ([$n | to_entries[] | select($o[.key] == null)] | length) as $added
          | ([$n | to_entries[] | select(($o[.key] != null) and ($o[.key].sha256 != .value.sha256))] | length) as $changed
          | ([$o | to_entries[] | select($n[.key] == null)] | length) as $removed
          | "\($added) added, \($changed) changed, \($removed) removed"')
        MSG="Update Claude docs manifest - $(date -u +'%Y-%m-%d') | ${SUMMARY}"
        {
          echo "message<<EOF"
          echo "${MSG}"
          echo "EOF"
        } >> $GITHUB_OUTPUT

    - name: Commit and push if changed
      if: steps.verify-changed-files.outputs.changed == 'true'
      env:
        COMMIT_MESSAGE: ${{ steps.commit-msg.outputs.message }}
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        # Only paths_manifest.json + search_index.json are staged (no prose committed).
        git commit -m "${COMMIT_MESSAGE}"
        git pull --rebase origin main
        git push
